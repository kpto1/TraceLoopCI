name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: traceloop
          POSTGRES_PASSWORD: traceloop_dev
          POSTGRES_DB: traceloop
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U traceloop" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pip install --no-deps -e . -e sdk/python
      - run: ruff check app tests sdk/python migrations
      - run: python -m pytest tests sdk/python/tests --cov=app --cov-report=xml
      - name: PostgreSQL migrations and integration
        env:
          DATABASE_URL: postgresql+asyncpg://traceloop:traceloop_dev@localhost:5432/traceloop
          REDIS_URL: redis://localhost:6379/0
          TEST_REAL_REDIS: '1'
        run: |
          alembic upgrade head
          python -m pytest tests -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile && pnpm test && pnpm build
        working-directory: frontend
      - run: pnpm install --frozen-lockfile && pnpm test
        working-directory: sdk/typescript
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 120
      - run: curl --fail http://localhost:3000/ && curl --fail http://localhost:8000/ready
      - if: always()
        run: docker compose logs && docker compose down
